repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      # Guards against accidentally committing dataset files. `data/metadata/`
      # is excluded because it holds intentional analysis outputs that are
      # legitimately large (the per-file/per-column missingness report is ~2 MB);
      # the raw dataset itself is blocked by .gitignore, not by this hook.
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        exclude: ^data/metadata/
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
